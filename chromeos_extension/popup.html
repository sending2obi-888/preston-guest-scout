<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Preston Scout Widget</title>
  <style>
    :root {
      --primary: #0b57d0;
      --primary-container: #d3e3fd;
      --on-primary-container: #041e49;
      --surface: #f8fafd;
      --card: #ffffff;
      --outline: #c4c7c5;
      --text: #1f1f1f;
      --subtext: #444746;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: 'Google Sans', Roboto, system-ui, sans-serif;
      background: var(--surface);
      color: var(--text);
    }
    header {
      background: var(--primary-container);
      color: var(--on-primary-container);
      padding: 14px 16px;
      border-bottom: 1px solid var(--outline);
    }
    header h1 {
      font-size: 15px;
      font-weight: 700;
    }
    header p {
      font-size: 11.5px;
      opacity: 0.85;
      margin-top: 2px;
    }
    #guest-list {
      list-style: none;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 410px;
      overflow-y: auto;
    }
    .guest-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 1px solid #e1e5ea;
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .guest-row:hover {
      background: #eef3fc;
      border-color: var(--primary);
    }
    .guest-name {
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: #c4eed0;
      color: #0f5223;
      margin-left: 8px;
      flex-shrink: 0;
    }
    .empty {
      padding: 24px 16px;
      text-align: center;
      font-size: 13px;
      color: var(--subtext);
    }
  </style>
</head>
<body>
  <header>
    <h1>Preston Guest Scout</h1>
    <p id="subtitle">Last 10 Guests Input</p>
  </header>
  <ul id="guest-list">
    <li class="empty">Loading recent guests...</li>
  </ul>
  <script src="popup.js"></script>
</body>
</html>
